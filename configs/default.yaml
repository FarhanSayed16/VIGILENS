# VIGILENS — vision / analytics thresholds (pilot start values)
# Tuned on scripted behaviours (Phase 21). See docs/THRESHOLDS.md.
# Worker reads this file (CONFIG_PATH). Do not invent per-seat precision.

version: 1

sampling:
  # Live cockpit boosts preview (~18 fps) and metrics (≥2.5 fps) separately.
  frames_per_second: 2.5          # metric sample rate for live / batch
  window_seconds: 30              # TTOI aggregation window
  partial_window_min_seconds: 15  # below this → partial_window, no decline alert
  min_usable_sample_frac: 0.35    # seat usable in window if ≥ this fraction observable

orientation:
  # Tier-2 head yaw' band (MediaPipe/solvePnP). Locked product start: 30°.
  yaw_threshold_deg: 30
  # Tier-1 body/shoulder proxy is coarser — wider band (scripted eval).
  tier1_yaw_threshold_deg: 45
  # Head-down cue when pitch ≥ this (+pitch = look down, Phase 18 convention).
  pitch_down_threshold_deg: 20
  # Tier-2 only if inter-outer-eye width ≳ this; else Tier-1 or unobservable.
  face_width_min_px: 80
  head_down_min_seconds: 8        # sustained head-down for HDC % in window

coverage:
  min_coverage_pct: 70            # below → insufficient visual evidence (null TTOI)
  # 1 = solo desk / webcam tests; raise to ~5 for multi-student classrooms
  min_usable_seats: 1

calibration:
  occupied_seat_min_fraction: 0.5 # seat occupied if person present in ≥50% of calib samples
  horizon_seconds: 180            # use first ~3 min of samples for N_expected

decline:
  smooth_median_seconds: 90       # rolling median smoother (~3 windows @ 30s)
  baseline_seconds: 180           # recent baseline (~3 min / 6 windows)
  min_drop_points: 10             # TTOI points vs baseline
  min_persist_windows: 2          # must persist across windows

tiers:
  # Tier 1: body/pose when face tiny / far seats
  # Tier 2: head pose when face large enough
  enable_tier2_head_pose: true

modes:
  # note_taking: head-down is expected (not treated as failure in scoring policy)
  respect_teaching_modes: true

models:
  yolo_pose_weights: models/yolov8n-pose.pt   # copy or Ultralytics download into models/
  mediapipe_face_landmarker: models/face_landmarker.task

privacy:
  purge_video_after_analysis: true
  store_face_crops: false
  store_embeddings: false
